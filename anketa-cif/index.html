<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Mg Accounting · Анкета для инвестиционной фирмы CySEC</title>
<meta property="og:title" content="Mg Accounting · Анкета для инвестиционной фирмы CySEC">
<meta property="og:description" content="21 вопрос, около 10 минут. По ответам готовим окончательное предложение с фиксированной стоимостью.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#10231d; --green2:#1a342b; --rose:#e2b9a9; --wine:#8c1f2c; --cream:#f8f6f1;
    --ink:#16201c; --grey:#5f6763; --line:#e2ddd3; --head:#efeae2; --note:#f6e6e3; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Manrope","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:96px}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}

  .hero{background:var(--green);color:#f4efe6;padding:28px 0 44px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{font-size:21px;font-weight:800;letter-spacing:-.01em}
  .logo span{color:var(--rose)}
  .lang{display:flex;background:var(--green2);border-radius:999px;padding:4px}
  .lang button{font:inherit;font-size:13px;font-weight:700;letter-spacing:.06em;color:#b9c1bb;background:none;border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--rose);color:var(--green)}
  .kick{margin-top:56px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);font-weight:700}
  h1{margin-top:12px;font-size:clamp(28px,5.2vw,44px);line-height:1.12;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
  h1 span{color:var(--rose)}
  .sub{margin-top:18px;font-size:17px;line-height:1.6;color:#d5d9d3;max-width:620px}
  .bar{width:52px;height:3px;background:var(--wine);margin-top:26px}
  .stats{margin-top:34px;border-top:1px solid #3a4a44;padding-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .stats b{display:block;font-size:22px;color:#fff;font-weight:800}
  .stats span{font-size:13px;color:#b9c1bb;line-height:1.45;display:block;margin-top:2px}

  .hint{margin:28px 0 8px;font-size:15px;color:var(--grey)}
  section.card{background:var(--white);border:1px solid var(--line);border-radius:18px;margin-top:20px;overflow:hidden}
  .card h2{display:flex;align-items:center;gap:14px;background:var(--head);padding:16px 22px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
  .card h2 i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:var(--rose);display:grid;place-items:center;font-size:13px;letter-spacing:0}
  .q{padding:18px 22px;border-top:1px solid var(--line)}
  .q label,.q .lbl{display:block;font-weight:700;font-size:16px}
  .q .lbl em,.q label em{font-style:normal;color:var(--wine);font-size:12px;font-weight:800;letter-spacing:.08em;margin-right:8px}
  .q small{display:block;color:var(--grey);font-size:13.5px;margin-top:3px}
  .q input[type=text],.q input[type=email]{width:100%;margin-top:12px;font:inherit;font-size:16px;color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
  .q input:focus{border-color:var(--wine);box-shadow:0 0 0 3px rgba(140,31,44,.12);background:#fff}
  .q.err input{border-color:var(--wine)}
  .q .msg{display:none;color:var(--wine);font-size:13px;font-weight:600;margin-top:6px}
  .q.err .msg{display:block}
  .yn{display:flex;gap:10px;margin-top:12px}
  .yn label{flex:none;font-weight:700;font-size:15px;cursor:pointer}
  .yn input{position:absolute;opacity:0;pointer-events:none}
  .yn span{display:block;min-width:92px;text-align:center;padding:10px 22px;border:1px solid var(--line);border-radius:999px;background:var(--cream);transition:all .15s}
  .yn input:checked+span{background:var(--green);border-color:var(--green);color:var(--rose)}
  .yn input:focus-visible+span{box-shadow:0 0 0 3px rgba(140,31,44,.2)}

  .next{margin-top:28px;background:var(--green);color:#e9ece7;border-radius:18px;padding:28px 26px}
  .next .t{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);font-weight:800}
  .next ol{list-style:none;margin-top:14px;counter-reset:s}
  .next li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:12px;font-size:15px;line-height:1.55}
  .next li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;border:1px solid var(--rose);color:var(--rose);font-size:12px;font-weight:800;display:grid;place-items:center}
  .foot{margin:26px 0 0;font-size:13px;color:var(--grey);text-align:center}
  .foot a{color:inherit}

  .dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
  .dock .wrap{display:flex;align-items:center;gap:18px;padding-top:12px;padding-bottom:12px}
  .prog{flex:1;min-width:0}
  .prog div{font-size:13px;font-weight:700;color:var(--grey)}
  .track{height:6px;background:var(--head);border-radius:99px;margin-top:6px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--wine);border-radius:99px;transition:width .25s}
  .btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:14px 26px;background:var(--green);color:var(--rose);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--green2)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}

  .done{display:none;padding:56px 0 20px}
  .done .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px 28px;text-align:center}
  .done .ok{width:56px;height:56px;border-radius:50%;background:var(--green);color:var(--rose);display:grid;place-items:center;font-size:26px;margin:0 auto 18px}
  .done h2{font-size:26px;font-weight:800;letter-spacing:-.01em}
  .done p{color:var(--grey);margin-top:10px;max-width:520px;margin-left:auto;margin-right:auto}
  .done .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  body.sent .form,body.sent .dock{display:none}
  body.sent .done{display:block}
  body.sent{padding-bottom:40px}
  @media (max-width:560px){
    .stats{grid-template-columns:1fr;gap:12px}
    .kick{margin-top:40px}
    .dock .wrap{gap:12px}
    .btn{padding:13px 20px}
    .q,.card h2{padding-left:16px;padding-right:16px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="top">
      <div class="logo">Mg <span>Accounting</span></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <div class="kick" data-t="kick"></div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="bar"></div>
    <div class="stats">
      <div><b data-t="s1b"></b><span data-t="s1"></span></div>
      <div><b data-t="s2b"></b><span data-t="s2"></span></div>
      <div><b data-t="s3b"></b><span data-t="s3"></span></div>
    </div>
  </div>
</header>

<main class="wrap">
  <form class="form" id="form" novalidate>
    <p class="hint" data-t="hint"></p>
    <div id="sections"></div>
    <div class="next">
      <div class="t" data-t="nextT"></div>
      <ol id="steps"></ol>
    </div>
  </form>

  <div class="done" id="done">
    <div class="box">
      <div class="ok">✓</div>
      <h2 data-t="doneH"></h2>
      <p data-t="doneP"></p>
      <div class="acts">
        <a class="btn" id="mail" href="#" data-t="mail"></a>
        <button type="button" class="btn ghost" id="copy" data-t="copy"></button>
      </div>
    </div>
  </div>

  <p class="foot">Mg Accounting · <a href="https://maizongroup.com">maizongroup.com</a> · <a href="mailto:info@maizongroup.com">info@maizongroup.com</a></p>
</main>

<div class="dock">
  <div class="wrap">
    <div class="prog"><div id="count"></div><div class="track"><i id="fill"></i></div></div>
    <button type="submit" form="form" class="btn" data-t="send"></button>
  </div>
</div>

<script>
(function(){
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbyD0x_m3pR8nmB0sFk9ci46lMgGOWO2pBquoVyVsvljDY5m1zCmMZXfp_TLEaDvyL_u4A/exec";
  var KEY = "mg-anketa-cif-v1";

  var T = {
    ru:{ doc:"Mg Accounting · Анкета для инвестиционной фирмы CySEC",
      kick:"Анкета для расчёта стоимости",
      title:"Бухгалтерия для <span>инвестиционной фирмы на Кипре</span>",
      sub:"Ответьте на 21 вопрос, и мы подготовим окончательное предложение с фиксированной стоимостью: учёт, зарплата, НДС и годовой аудит.",
      s1b:"21 вопрос", s1:"только то, что влияет на цену",
      s2b:"10 минут", s2:"ответы сохраняются, можно вернуться",
      s3b:"Фиксированная цена", s3:"включая аудит под вашу лицензию",
      hint:"Если по какому-то пункту точных данных нет, укажите примерное значение или оставьте поле пустым: уточним на коротком созвоне.",
      yes:"Да", no:"Нет", req:"Заполните это поле",
      nextT:"Что дальше",
      steps:["Вы отправляете анкету.","При необходимости мы задаём уточняющие вопросы - обычно это один короткий созвон.","Мы готовим окончательное предложение: состав работ, фиксированная стоимость обслуживания и аудита, перечень разовых работ по приёму учёта.","После согласования подписываем договор и получаем доступы к банку, TAXISNET и системе социального страхования."],
      count:function(a,b){return "Заполнено "+a+" из "+b;}, send:"Отправить анкету",
      doneH:"Спасибо, анкета отправлена", doneP:"Мы вернёмся с предложением. Чтобы у вас осталась копия ответов, отправьте их себе и нам на почту или скопируйте.",
      mail:"Отправить копию на почту", copy:"Скопировать ответы", copied:"Скопировано" },
    en:{ doc:"Mg Accounting · Questionnaire for a CySEC investment firm",
      kick:"Pricing questionnaire",
      title:"Accounting for an <span>investment firm in Cyprus</span>",
      sub:"Answer 21 questions and we will prepare a final proposal with a fixed fee: bookkeeping, payroll, VAT and the annual audit.",
      s1b:"21 questions", s1:"only what affects the fee",
      s2b:"10 minutes", s2:"answers are saved, you can come back",
      s3b:"Fixed fee", s3:"audit for your licence included",
      hint:"If you do not have exact figures for an item, give an estimate or leave the field blank: we will clarify it on a short call.",
      yes:"Yes", no:"No", req:"Please fill in this field",
      nextT:"What happens next",
      steps:["You submit the questionnaire.","If needed, we ask follow-up questions - usually one short call is enough.","We prepare a final proposal: scope of work, fixed fee for accounting and audit, and the one-off work needed to take over the books.","Once agreed, we sign the engagement letter and receive access to the bank, TAXISNET and the Social Insurance system."],
      count:function(a,b){return a+" of "+b+" answered";}, send:"Submit",
      doneH:"Thank you, the questionnaire has been sent", doneP:"We will come back with a proposal. To keep a copy of your answers, e-mail them to yourself and to us, or copy them.",
      mail:"E-mail a copy", copy:"Copy answers", copied:"Copied" }
  };

  // t: "t" text, "yn" yes/no. r: required
  var S = [
    { ru:"О компании", en:"About the company", q:[
      {id:"name", r:1, ru:"Название компании и регистрационный номер (HE)", en:"Company name and registration number (HE)"},
      {id:"lic", ru:"Номер лицензии CySEC", en:"CySEC licence number"},
      {id:"contact", r:1, ru:"Контактное лицо и e-mail для вопросов по учёту", en:"Contact person and e-mail for accounting matters"} ]},
    { ru:"Лицензия и деятельность", en:"Licence and activity", q:[
      {id:"services", ru:"Какие инвестиционные услуги оказывает компания", en:"Which investment services does the company provide", hru:"приём и исполнение поручений, управление портфелем, консультирование и т. д.", hen:"reception and execution of orders, portfolio management, investment advice, etc."},
      {id:"clientMoney", t:"yn", ru:"Компания держит деньги клиентов", en:"The company holds client money"},
      {id:"ownAccount", t:"yn", ru:"Компания торгует за собственный счёт", en:"The company deals on own account"},
      {id:"clients", ru:"Количество активных клиентов", en:"Number of active clients", hru:"примерно", hen:"approximately"},
      {id:"regReporting", ru:"Кто готовит регуляторную отчётность в CySEC", en:"Who prepares regulatory reporting to CySEC", hru:"свой отдел, внешний провайдер", hen:"in-house team, external provider"} ]},
    { ru:"Объём операций", en:"Transaction volume", q:[
      {id:"docs", ru:"Первичные документы: сколько в месяц", en:"Source documents per month", hru:"входящие и исходящие счета, чеки, акты", hen:"incoming and outgoing invoices, receipts, statements of work"},
      {id:"bankOps", ru:"Банковские операции по собственным счетам: сколько в месяц", en:"Bank transactions on own accounts per month", hru:"строк в выписках суммарно", hen:"statement lines across all accounts"},
      {id:"accounts", ru:"Счета компании: сколько и где", en:"Company accounts: how many and where", hru:"банки и платёжные системы", hen:"banks and payment institutions"},
      {id:"currencies", ru:"Валюты операций", en:"Transaction currencies", hru:"EUR, USD, GBP и др.", hen:"EUR, USD, GBP, etc."},
      {id:"clientOps", ru:"Как клиентские операции попадают в бухгалтерию", en:"How client transactions reach the books", hru:"сводной проводкой из бэк-офиса или каждая операция отдельно", hen:"summary entry from the back office or each transaction separately"},
      {id:"turnover", ru:"Годовой оборот", en:"Annual turnover", hru:"в EUR, примерно", hen:"in EUR, approximately"} ]},
    { ru:"Налоги и сотрудники", en:"Taxes and employees", q:[
      {id:"vat", t:"yn", ru:"Компания стоит на учёте по НДС (VAT)", en:"The company is registered for VAT"},
      {id:"vies", t:"yn", ru:"Компания подаёт отчёты VIES", en:"The company files VIES returns"},
      {id:"staff", ru:"Количество сотрудников, включая директоров на зарплате", en:"Number of employees, including directors on payroll"} ]},
    { ru:"Текущее состояние учёта", en:"Current state of the books", q:[
      {id:"books", ru:"Кто ведёт учёт сейчас и в какой программе", en:"Who keeps the books now and in which software", hru:"своя бухгалтерия, аутсорс; QuickBooks, Xero и др.", hen:"in-house accountant, outsourced; QuickBooks, Xero, etc."},
      {id:"audit", ru:"Последняя аудированная отчётность: за какой год и кто аудитор", en:"Latest audited financial statements: which year and which auditor"},
      {id:"from", ru:"С какой даты нужно принять учёт", en:"From which date should we take over the books"},
      {id:"overdue", ru:"Есть ли просроченные подачи отчётности", en:"Are there any overdue filings", hru:"НДС, VIES, соц. страхование, налог на прибыль", hen:"VAT, VIES, social insurance, income tax"} ]}
  ];
  var ALL = []; S.forEach(function(s){ s.q.forEach(function(q){ ALL.push(q); }); });

  var lang = "ru", ans = {};
  try { var saved = JSON.parse(localStorage.getItem(KEY) || "{}"); ans = saved.ans || {}; if (saved.lang) lang = saved.lang; }
  catch(e){}
  if (!ans || typeof ans !== "object") ans = {};
  try { if (/[?&]lang=en\b/.test(location.search)) lang = "en"; } catch(e){}

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify({ans:ans,lang:lang})); } catch(e){} }

  function render(){
    var L = T[lang];
    document.documentElement.lang = lang; document.title = L.doc;
    document.querySelectorAll("[data-t]").forEach(function(el){ el.innerHTML = L[el.getAttribute("data-t")]; });
    document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-lang")===lang); });
    var html = "";
    S.forEach(function(s,si){
      html += '<section class="card"><h2><i>'+(si+1)+'</i>'+esc(s[lang])+'</h2>';
      s.q.forEach(function(q,qi){
        var num = (si+1)+"."+(qi+1), hint = q["h"+lang], v = ans[q.id] || "";
        html += '<div class="q" data-id="'+q.id+'">';
        if (q.t === "yn") {
          html += '<div class="lbl" id="l-'+q.id+'"><em>'+num+'</em>'+esc(q[lang])+'</div>'+
            '<div class="yn" role="radiogroup" aria-labelledby="l-'+q.id+'">'+
            ["yes","no"].map(function(o){ return '<label><input type="radio" name="'+q.id+'" value="'+o+'"'+(v===o?" checked":"")+'><span>'+L[o]+'</span></label>'; }).join("")+'</div>';
        } else {
          html += '<label for="f-'+q.id+'"><em>'+num+'</em>'+esc(q[lang])+'</label>'+
            (hint ? '<small>'+esc(hint)+'</small>' : '')+
            '<input type="text" id="f-'+q.id+'" name="'+q.id+'" value="'+esc(v)+'" autocomplete="off"'+(q.r?' required':'')+'>'+
            '<div class="msg">'+L.req+'</div>';
        }
        html += '</div>';
      });
      html += '</section>';
    });
    document.getElementById("sections").innerHTML = html;
    document.getElementById("steps").innerHTML = L.steps.map(function(t){ return "<li>"+esc(t)+"</li>"; }).join("");
    progress();
  }

  function progress(){
    var n = ALL.filter(function(q){ return (ans[q.id] || "").trim(); }).length;
    document.getElementById("count").textContent = T[lang].count(n, ALL.length);
    document.getElementById("fill").style.width = (100*n/ALL.length)+"%";
  }

  function summary(){
    var out = ["АНКЕТА: БУХГАЛТЕРИЯ ИНВЕСТИЦИОННОЙ ФИРМЫ CySEC", "Язык заполнения: "+lang.toUpperCase(), ""];
    S.forEach(function(s,si){
      out.push((si+1)+". "+s.ru.toUpperCase());
      s.q.forEach(function(q,qi){
        var v = (ans[q.id] || "").trim();
        if (q.t === "yn") v = v === "yes" ? "Да" : v === "no" ? "Нет" : "";
        out.push((si+1)+"."+(qi+1)+" "+q.ru+": "+(v || "-"));
      });
      out.push("");
    });
    return out.join("\n");
  }

  document.querySelector(".lang").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (!b) return;
    lang = b.getAttribute("data-lang"); save(); render();
  });
  var form = document.getElementById("form");
  form.addEventListener("input", function(e){
    var el = e.target; if (!el.name) return;
    ans[el.name] = el.value; save(); progress();
    var box = el.closest(".q"); if (box && el.value.trim()) box.classList.remove("err");
  });
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var first = null;
    ALL.forEach(function(q){
      if (!q.r) return;
      var box = document.querySelector('.q[data-id="'+q.id+'"]'), bad = !(ans[q.id] || "").trim();
      box.classList.toggle("err", bad);
      if (bad && !first) first = box;
    });
    if (first) { first.scrollIntoView({block:"center"}); var i = first.querySelector("input"); if (i) i.focus({preventScroll:true}); return; }
    var text = summary();
    try {
      fetch(ENDPOINT, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({ company: ans.name || "", field: "Mg Accounting: анкета CIF, Кипр", contactName: ans.contact || "", contactHandle: "", levelName: "Анкета: бухгалтерия CIF", note: text }) }).catch(function(){});
    } catch(err){}
    document.getElementById("mail").href = "mailto:info@maizongroup.com?subject=" + encodeURIComponent("Анкета CIF: " + (ans.name || "")) + "&body=" + encodeURIComponent(text);
    document.body.classList.add("sent"); window.scrollTo(0,0);
  });
  document.getElementById("copy").addEventListener("click", function(){
    var btn = this, text = summary(), ok = function(){ btn.textContent = T[lang].copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, function(){});
    else { var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch(e){} ta.remove(); }
  });

  render();
})();
</script>
</body>
</html>
